services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simmerly
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: simmerly
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U simmerly"], interval: 5s, retries: 10 }
  app:
    build: .
    restart: unless-stopped
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgres://simmerly:${POSTGRES_PASSWORD}@db:5432/simmerly
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET (openssl rand -hex 32)}
      SITE_URL: ${SITE_URL:-http://localhost:3000}
    volumes: [uploads:/data/uploads]
    ports: ["127.0.0.1:3000:3000"]   # put Caddy/Nginx with TLS in front
volumes: { pgdata: {}, uploads: {} }
